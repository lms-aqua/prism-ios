[global]
   server role = standalone server
   security = user
   map to guest = never
   smb ports = 445
   disable netbios = yes
   server min protocol = SMB2
   # Tailscale uses a point-to-point interface that Samba does not bind to
   # reliably. Restrict clients by their Tailscale source address instead.
   bind interfaces only = no
   hosts allow = 127. 100.64.0.0/10
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /dev/stdout
   logging = file
   max log size = 0

[prism-ios]
   path = /share
   browseable = yes
   read only = no
   guest ok = no
   valid users = prismshare
   force user = lost
   force group = lost
   create mask = 0664
   directory mask = 0775
